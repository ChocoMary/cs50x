{% extends "layout.html"}

{% block title %}
Savings
{% endblock %}

{% block main %}
<div class="container mt-4" style="max-width: 500px;">
    <h2 class="text-centerl mb-4">Add to Saving</h2>

    <form action="/saving" method="post" class="row g-3">

        <!-- Select existing goals -->
         <div class="col-md-6">
            <label class="form-label">Choose Saving Goal</label>
            <select name="goal_id" class="form-select">
                <option value="" selected disabled>-- Select Goal --</option>
                {% for goal in goals %}
                    <option value="{{ goal.id }}">{{ goal.name }} (Saved: {{ goal.saved }}</option>
                {% endfor %}
            </select>
         </div>

         <!-- Create new goal -->

         <div class="col-md-6">
            <label class="form-label">-- Create New Goal --</label>
            <input class="form-control" name="new_goal" autocomplete="off" placeholder="New Goal Name" type="text">
         </div>

         <!-- Deposit amount  -->
          <div class="col-md-6">
            <label class="form-label">-- Deposit Amount ($) --</label>
            <input class="form-control" name="amount" step="0.01" autocomplete="off" placeholder="$ 0.00" required>
          </div>

          <div class="col-md-12 text-end">
            <button class="btn btn-primary">Add Deposit</button>
          </div>
    </form>
</div>
{% endblock %}
